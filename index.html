<style>
  :root{
    --ink:#12302c;
    --teal-deep:#0e3d38;
    --teal:#155e54;
    --teal-soft:#e5f1ee;
    --paper:#f6f8f7;
    --card:#ffffff;
    --line:#d9e4e1;
    --coral:#e2694f;
    --coral-soft:#fbe7e1;
    --muted:#5f7873;
    --shadow: 0 1px 2px rgba(14,61,56,.06), 0 8px 24px -12px rgba(14,61,56,.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(14,61,56,.06) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'IBM Plex Sans Thai', sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:36px 20px 80px;}

  /* header */
  header{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:28px;
    border-bottom:1px solid var(--line);
    padding-bottom:22px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--coral);
    font-weight:600;
  }
  h1{
    font-family:'Noto Serif Thai', serif;
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    margin:2px 0 4px;
    color:var(--teal-deep);
    line-height:1.25;
  }
  .sub{color:var(--muted);font-size:14.5px;}

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:22px;
    align-items:center;
  }
  .search-box{
    position:relative;
    flex:1 1 280px;
  }
  .search-box input{
    width:100%;
    padding:12px 16px 12px 40px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--card);
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-box input:focus{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(21,94,84,.12);
  }
  .search-box svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--muted);
  }
  .chip-group{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    font-family:'IBM Plex Sans Thai', sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:9px 14px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--teal-deep);
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip:hover{border-color:var(--teal);}
  .chip.active{
    background:var(--teal-deep);
    border-color:var(--teal-deep);
    color:#fff;
  }
  .count-line{
    font-size:13px;color:var(--muted);margin-bottom:14px;
    font-family:'JetBrains Mono', monospace;
  }

  /* grid */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:14px;
  }
  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 16px 14px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    overflow:hidden;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:var(--teal);
  }
  .card.has-role::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:0;height:0;
    border-style:solid;
    border-width:0 34px 34px 0;
    border-color:transparent var(--coral) transparent transparent;
  }
  .idx{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:.04em;
  }
  .card h3{
    font-family:'Noto Serif Thai', serif;
    font-size:16.5px;
    font-weight:600;
    margin:4px 0 2px;
    color:var(--teal-deep);
    line-height:1.35;
  }
  .nickname{
    font-size:13px;
    color:var(--coral);
    font-weight:600;
    margin-bottom:8px;
  }
  .card .meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .sid{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--muted);
  }
  .gender-dot{
    width:8px;height:8px;border-radius:50%;
  }
  .gender-dot.M{background:#3f7cac;}
  .gender-dot.F{background:#e2694f;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14.5px;
  }

  /* modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(14,30,28,.45);
    backdrop-filter:blur(2px);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);
    border-radius:16px;
    max-width:420px;width:100%;
    padding:28px 26px 24px;
    position:relative;
    box-shadow:0 24px 60px -12px rgba(14,61,56,.35);
    animation:pop .18s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
  .modal .close{
    position:absolute;top:16px;right:16px;
    background:none;border:none;cursor:pointer;
    color:var(--muted);
    width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    transition:background .15s ease;
  }
  .modal .close:hover{background:var(--teal-soft);}
  .modal .idx{display:block;margin-bottom:6px;}
  .modal h2{
    font-family:'Noto Serif Thai', serif;
    font-size:22px;
    color:var(--teal-deep);
    margin:0 0 2px;
  }
  .modal .m-nick{color:var(--coral);font-weight:600;font-size:14.5px;margin-bottom:18px;}
  .modal .row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
    gap:16px;
  }
  .modal .row:last-child{border-bottom:none;}
  .modal .row .label{color:var(--muted);flex-shrink:0;}
  .modal .row .value{text-align:right;font-weight:500;}
  .role-badge{
    display:inline-block;
    margin-top:14px;
    background:var(--coral-soft);
    color:var(--coral);
    font-size:13px;
    font-weight:600;
    padding:8px 12px;
    border-radius:8px;
    line-height:1.4;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    margin-top:50px;
    font-family:'JetBrains Mono', monospace;
  }
</style>

{no:60,sid:"6911700655",prefix:"นาย",first:"สิทธิพงษ์",last:"กล่ำมาก",nick:"เบส",gender:"M",role:null},
{no:61,sid:"6911700663",prefix:"นาย",first:"สิรวิชญ์",last:"จงกรด",nick:"ใจแอนท์",gender:"M",role:null},
];

const grid = document.getElementById('grid');
const emptyState = document.getElementById('emptyState');
const countLine = document.getElementById('countLine');
const searchInput = document.getElementById('searchInput');
const genderChips = document.querySelectorAll('#genderChips .chip');
const roleChips = document.querySelectorAll('#roleChips .chip');

let state = { query:'', gender:'all', role:'all' };

function genderLabel(g){ return g==='M' ? 'ชาย' : 'หญิง'; }

function matches(s){
  const q = state.query.trim().toLowerCase();
  if(q){
    const hay = (s.prefix+s.first+s.last+s.nick+s.sid).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  if(state.gender !== 'all' && s.gender !== state.gender) return false;
  if(state.role === 'has' && !s.role) return false;
  if(state.role === 'none' && s.role) return false;
  return true;
}

function render(){
  const filtered = students.filter(matches);
  grid.innerHTML = '';
  if(filtered.length === 0){
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';
    filtered.forEach(s=>{
      const card = document.createElement('div');
      card.className = 'card' + (s.role ? ' has-role':'');
      card.innerHTML = `
        <span class="idx">#${String(s.no).padStart(2,'0')}</span>
        <h3>${s.prefix} ${s.first} ${s.last}</h3>
        <div class="nickname">"${s.nick}"</div>
        <div class="meta">
          <span class="sid">${s.sid}</span>
          <span class="gender-dot ${s.gender}"></span>
        </div>
      `;
      card.addEventListener('click', ()=>openModal(s));
      grid.appendChild(card);
    });
  }
  countLine.textContent = `พบ ${filtered.length} คน จากทั้งหมด ${students.length} คน`;
}

const overlay = document.getElementById('overlay');
function openModal(s){
  document.getElementById('mIdx').textContent = `#${String(s.no).padStart(2,'0')}`;
  document.getElementById('mName').textContent = `${s.prefix} ${s.first} ${s.last}`;
  document.getElementById('mNick').textContent = `ชื่อเล่น: ${s.nick}`;
  document.getElementById('mSid').textContent = s.sid;
  document.getElementById('mGender').textContent = genderLabel(s.gender);
  const roleWrap = document.getElementById('mRoleWrap');
  roleWrap.innerHTML = s.role ? `<div class="role-badge">🎖 ${s.role}</div>` : '';
  overlay.classList.add('open');
}
document.getElementById('closeModal').addEventListener('click', ()=>overlay.classList.remove('open'));
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') overlay.classList.remove('open'); });

searchInput.addEventListener('input', (e)=>{ state.query = e.target.value; render(); });
genderChips.forEach(chip=>{
  chip.addEventListener('click', ()=>{
    genderChips.forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    state.gender = chip.dataset.gender;
    render();
  });
});
roleChips.forEach(chip=>{
  chip.addEventListener('click', ()=>{
    roleChips.forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    state.role = chip.dataset.role;
    render();
  });
});

render();
</script>
